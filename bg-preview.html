<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodiPalette - 배경 스타일 미리보기</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: #e8e8e8; padding: 20px; }
h1 { text-align: center; font-size: 1.2rem; margin-bottom: 4px; color: #333; }
p.sub { text-align: center; font-size: 0.75rem; color: #999; margin-bottom: 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; }
.card { border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.12); transition: transform 0.2s; }
.card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
.preview { height: 280px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.preview canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.mock-ui { position: relative; z-index: 2; width: 85%; }
.mock-header { background: rgba(255,255,255,0.7); backdrop-filter: blur(8px); border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; text-align: center; }
.mock-header.dark { background: rgba(30,30,50,0.7); }
.mock-header .title { font-size: 0.7rem; font-weight: 700; color: #333; }
.mock-header.dark .title { color: #eee; }
.mock-card { background: rgba(255,255,255,0.75); backdrop-filter: blur(8px); border-radius: 10px; padding: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.mock-card.dark { background: rgba(30,30,50,0.75); }
.mock-colors { display: flex; gap: 3px; margin-bottom: 6px; }
.mock-colors div { flex: 1; height: 28px; border-radius: 3px; }
.mock-labels { display: flex; gap: 3px; margin-bottom: 6px; }
.mock-labels span { flex: 1; text-align: center; font-size: 0.5rem; color: #999; }
.mock-card.dark .mock-labels span { color: #666; }
.mock-text { height: 5px; background: rgba(0,0,0,0.08); border-radius: 3px; margin-bottom: 3px; }
.mock-text.short { width: 55%; }
.mock-card.dark .mock-text { background: rgba(255,255,255,0.08); }
.info { padding: 12px 16px; background: #fff; }
.info .num { font-size: 0.65rem; color: #aaa; font-weight: 700; letter-spacing: 0.05em; }
.info .name { font-size: 0.9rem; font-weight: 700; color: #222; margin: 2px 0; }
.info .desc { font-size: 0.7rem; color: #999; line-height: 1.5; }
</style>
</head>
<body>

<h1>CodiPalette 배경 스타일 미리보기</h1>
<p class="sub">선택한 코디 색상이 배경에 반영됩니다 · 마음에 드는 번호를 알려주세요</p>

<div class="grid" id="grid"></div>

<script>
const COLORS = ['#1B3A5C','#F5F5F5','#C19A6B','#722F37'];

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function makeSeed(colors) {
  return colors.reduce((s, c) => (s * 31 + parseInt(c.replace('#',''), 16)) | 0, 1);
}

// ── Background renderers ──
const BG = [
  // 1. Original oil paint (current)
  {
    name: '오일 페인팅 (현재)',
    desc: '유화 붓터치 스타일 · 현재 앱에 적용된 배경',
    render: (ctx, W, H, colors) => {
      let seed = makeSeed(colors);
      const rng = (a=0,b=1) => { seed=(Math.imul(seed,1664525)+1013904223)|0; return a+((seed>>>0)/0xffffffff)*(b-a); };
      ctx.fillStyle='#f0ede6'; ctx.fillRect(0,0,W,H);
      colors.forEach((hex,ci) => {
        const [r,g,b] = hexToRgb(hex);
        const baseAngle = (ci/colors.length)*Math.PI*0.75 - Math.PI*0.25 + rng(-0.15,0.15);
        for(let s=0;s<6;s++){
          const sx=rng(-W*0.1,W*1.1),sy=rng(-H*0.1,H*1.1),len=rng(W*0.5,W*1.1);
          const a=baseAngle+rng(-0.3,0.3),ex=sx+len*Math.cos(a),ey=sy+len*Math.sin(a);
          const bow=rng(-H*0.15,H*0.15);
          ctx.beginPath(); ctx.moveTo(sx,sy);
          ctx.bezierCurveTo(sx+len*0.3*Math.cos(a)+bow*Math.sin(a),sy+len*0.3*Math.sin(a)-bow*Math.cos(a),sx+len*0.7*Math.cos(a)+bow*0.6*Math.sin(a),sy+len*0.7*Math.sin(a)-bow*0.6*Math.cos(a),ex,ey);
          ctx.lineWidth=rng(W*0.06,W*0.18); ctx.lineCap='round'; ctx.strokeStyle=`rgba(${r},${g},${b},${rng(0.5,0.8)})`; ctx.stroke();
        }
      });
    }
  },
  // 2. Soft watercolor blobs
  {
    name: '수채화 블롭',
    desc: '부드럽게 번지는 수채화 느낌의 색상 블롭',
    render: (ctx, W, H, colors) => {
      ctx.fillStyle='#f7f5f0'; ctx.fillRect(0,0,W,H);
      let seed = makeSeed(colors);
      const rng = (a=0,b=1) => { seed=(Math.imul(seed,1664525)+1013904223)|0; return a+((seed>>>0)/0xffffffff)*(b-a); };
      colors.forEach((hex) => {
        const [r,g,b] = hexToRgb(hex);
        for(let i=0;i<3;i++){
          const x=rng(0,W),y=rng(0,H),rad=rng(W*0.15,W*0.4);
          const grad=ctx.createRadialGradient(x,y,0,x,y,rad);
          grad.addColorStop(0,`rgba(${r},${g},${b},${rng(0.12,0.25)})`);
          grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
          ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
        }
      });
    }
  },
  // 3. Minimal gradient stripe
  {
    name: '미니멀 스트라이프',
    desc: '선택한 4가지 색상이 세로로 은은하게 깔림',
    render: (ctx, W, H, colors) => {
      ctx.fillStyle='#f5f2ec'; ctx.fillRect(0,0,W,H);
      const sw = W / colors.length;
      colors.forEach((hex, i) => {
        const [r,g,b] = hexToRgb(hex);
        const grad = ctx.createLinearGradient(i*sw, 0, (i+1)*sw, 0);
        grad.addColorStop(0, `rgba(${r},${g},${b},0.06)`);
        grad.addColorStop(0.5, `rgba(${r},${g},${b},0.12)`);
        grad.addColorStop(1, `rgba(${r},${g},${b},0.06)`);
        ctx.fillStyle = grad; ctx.fillRect(i*sw, 0, sw, H);
      });
    }
  },
  // 4. Bokeh circles
  {
    name: '보케 서클',
    desc: '아웃포커스 카메라 느낌의 동그란 빛망울',
    render: (ctx, W, H, colors) => {
      ctx.fillStyle='#f0ede6'; ctx.fillRect(0,0,W,H);
      let seed = makeSeed(colors);
      const rng = (a=0,b=1) => { seed=(Math.imul(seed,1664525)+1013904223)|0; return a+((seed>>>0)/0xffffffff)*(b-a); };
      for(let i=0;i<20;i++){
        const hex = colors[Math.floor(rng(0,colors.length))];
        const [r,g,b] = hexToRgb(hex);
        const x=rng(0,W),y=rng(0,H),rad=rng(15,60);
        ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2);
        ctx.fillStyle=`rgba(${r},${g},${b},${rng(0.06,0.15)})`;
        ctx.fill();
      }
    }
  },
  // 5. Diagonal color bands
  {
    name: '대각선 컬러밴드',
    desc: '대각선으로 흐르는 넓은 색상 밴드',
    render: (ctx, W, H, colors) => {
      ctx.fillStyle='#f5f2ec'; ctx.fillRect(0,0,W,H);
      const bandH = (W+H) / colors.length;
      colors.forEach((hex, i) => {
        const [r,g,b] = hexToRgb(hex);
        ctx.save(); ctx.rotate(-Math.PI/6);
        ctx.fillStyle = `rgba(${r},${g},${b},0.08)`;
        ctx.fillRect(-W, i*bandH - H*0.3, W*3, bandH);
        ctx.restore();
      });
    }
  },
  // 6. Mesh gradient
  {
    name: '메시 그라데이션',
    desc: '여러 색상이 자연스럽게 섞이는 메시 배경',
    render: (ctx, W, H, colors) => {
      ctx.fillStyle='#f5f2ec'; ctx.fillRect(0,0,W,H);
      const positions = [[0.2,0.2],[0.8,0.2],[0.2,0.8],[0.8,0.8]];
      colors.forEach((hex, i) => {
        const [r,g,b] = hexToRgb(hex);
        const [px,py] = positions[i % 4];
        const grad = ctx.createRadialGradient(px*W,py*H,0,px*W,py*H,W*0.5);
        grad.addColorStop(0,`rgba(${r},${g},${b},0.15)`);
        grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
        ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
      });
    }
  },
  // 7. Geometric blocks
  {
    name: '지오메트릭 블록',
    desc: '큰 사각형 블록으로 색상을 배치',
    render: (ctx, W, H, colors) => {
      ctx.fillStyle='#f0ede6'; ctx.fillRect(0,0,W,H);
      let seed = makeSeed(colors);
      const rng = (a=0,b=1) => { seed=(Math.imul(seed,1664525)+1013904223)|0; return a+((seed>>>0)/0xffffffff)*(b-a); };
      colors.forEach((hex) => {
        const [r,g,b] = hexToRgb(hex);
        for(let i=0;i<2;i++){
          const x=rng(-W*0.2,W*0.8),y=rng(-H*0.2,H*0.8);
          const w=rng(W*0.3,W*0.6),h=rng(H*0.2,H*0.5);
          ctx.fillStyle=`rgba(${r},${g},${b},0.07)`;
          ctx.fillRect(x,y,w,h);
        }
      });
    }
  },
  // 8. Soft top-down gradient using colors
  {
    name: '컬러 그라데이션 (탑다운)',
    desc: '선택 색상이 위에서 아래로 은은하게 흐름',
    render: (ctx, W, H, colors) => {
      ctx.fillStyle='#f5f2ec'; ctx.fillRect(0,0,W,H);
      colors.forEach((hex, i) => {
        const [r,g,b] = hexToRgb(hex);
        const y0 = (i/colors.length)*H, y1 = ((i+1)/colors.length)*H;
        const grad = ctx.createLinearGradient(0,y0,0,y1);
        grad.addColorStop(0, `rgba(${r},${g},${b},0.1)`);
        grad.addColorStop(1, `rgba(${r},${g},${b},0.03)`);
        ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
      });
    }
  },
  // 9. Concentric rings
  {
    name: '동심원 링',
    desc: '중앙에서 퍼지는 색상 동심원',
    render: (ctx, W, H, colors) => {
      ctx.fillStyle='#f5f2ec'; ctx.fillRect(0,0,W,H);
      const cx=W/2,cy=H/2,maxR=Math.max(W,H)*0.6;
      colors.forEach((hex, i) => {
        const [r,g,b] = hexToRgb(hex);
        const r1 = maxR*(i/colors.length), r2 = maxR*((i+1)/colors.length);
        ctx.beginPath(); ctx.arc(cx,cy,r2,0,Math.PI*2);
        ctx.fillStyle=`rgba(${r},${g},${b},0.08)`;
        ctx.fill();
      });
    }
  },
  // 10. Fabric weave texture
  {
    name: '패브릭 직조',
    desc: '옷감 직조 느낌의 교차 패턴',
    render: (ctx, W, H, colors) => {
      ctx.fillStyle='#f0ede6'; ctx.fillRect(0,0,W,H);
      const size = 8;
      for(let x=0;x<W;x+=size){
        for(let y=0;y<H;y+=size){
          const ci = ((x/size)+(y/size)) % colors.length;
          const [r,g,b] = hexToRgb(colors[ci]);
          ctx.fillStyle = `rgba(${r},${g},${b},${(x/size+y/size)%2===0?0.04:0.07})`;
          ctx.fillRect(x,y,size,size);
        }
      }
    }
  },
  // 11. Clean solid (no color in bg)
  {
    name: '클린 솔리드',
    desc: '배경에 색상 없음, 카드만 부각되는 깔끔한 배경',
    render: (ctx, W, H) => {
      ctx.fillStyle='#f7f5f0'; ctx.fillRect(0,0,W,H);
    }
  },
  // 12. Soft noise + color tint
  {
    name: '노이즈 + 컬러 틴트',
    desc: '종이 질감에 선택 색상이 은은하게 깔림',
    render: (ctx, W, H, colors) => {
      ctx.fillStyle='#f3f0ea'; ctx.fillRect(0,0,W,H);
      // Color tint
      const [r,g,b] = hexToRgb(colors[0]);
      ctx.fillStyle=`rgba(${r},${g},${b},0.05)`; ctx.fillRect(0,0,W,H);
      // Noise
      const imgData = ctx.getImageData(0,0,W,H);
      for(let i=0;i<imgData.data.length;i+=4){
        const n = (Math.random()-0.5)*12;
        imgData.data[i]+=n; imgData.data[i+1]+=n; imgData.data[i+2]+=n;
      }
      ctx.putImageData(imgData,0,0);
    }
  },
  // 13. Corner color accents
  {
    name: '코너 컬러 악센트',
    desc: '네 모서리에 각 색상이 은은하게 번짐',
    render: (ctx, W, H, colors) => {
      ctx.fillStyle='#f5f2ec'; ctx.fillRect(0,0,W,H);
      const corners = [[0,0],[W,0],[0,H],[W,H]];
      colors.forEach((hex, i) => {
        const [r,g,b] = hexToRgb(hex);
        const [cx,cy] = corners[i % 4];
        const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,W*0.6);
        grad.addColorStop(0,`rgba(${r},${g},${b},0.18)`);
        grad.addColorStop(0.5,`rgba(${r},${g},${b},0.05)`);
        grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
        ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
      });
    }
  },
  // 14. Horizontal flowing wave
  {
    name: '플로잉 웨이브',
    desc: '물결처럼 흐르는 부드러운 색상 라인',
    render: (ctx, W, H, colors) => {
      ctx.fillStyle='#f5f2ec'; ctx.fillRect(0,0,W,H);
      colors.forEach((hex, ci) => {
        const [r,g,b] = hexToRgb(hex);
        const yBase = H*(ci+1)/(colors.length+1);
        ctx.beginPath(); ctx.moveTo(0, yBase);
        for(let x=0;x<=W;x+=5){
          ctx.lineTo(x, yBase + Math.sin(x*0.02+ci*2)*20);
        }
        ctx.lineWidth = 25; ctx.lineCap='round';
        ctx.strokeStyle=`rgba(${r},${g},${b},0.1)`;
        ctx.stroke();
      });
    }
  },
  // 15. Glass morphism with blobs
  {
    name: '글래스모피즘 블롭',
    desc: '유리 뒤에 색상 덩어리가 비치는 느낌',
    render: (ctx, W, H, colors) => {
      ctx.fillStyle='#f0eee8'; ctx.fillRect(0,0,W,H);
      let seed = makeSeed(colors);
      const rng = (a=0,b=1) => { seed=(Math.imul(seed,1664525)+1013904223)|0; return a+((seed>>>0)/0xffffffff)*(b-a); };
      colors.forEach((hex) => {
        const [r,g,b] = hexToRgb(hex);
        const x=rng(W*0.1,W*0.9),y=rng(H*0.1,H*0.9),rad=rng(W*0.12,W*0.25);
        const grad=ctx.createRadialGradient(x,y,0,x,y,rad);
        grad.addColorStop(0,`rgba(${r},${g},${b},0.25)`);
        grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
        ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
      });
    }
  },
  // ── DARK MODES ──
  // 16. Dark watercolor
  {
    name: '다크 수채화',
    desc: '어두운 배경에 수채화처럼 번지는 색상',
    dark: true,
    render: (ctx, W, H, colors) => {
      ctx.fillStyle='#1a1a2e'; ctx.fillRect(0,0,W,H);
      let seed = makeSeed(colors);
      const rng = (a=0,b=1) => { seed=(Math.imul(seed,1664525)+1013904223)|0; return a+((seed>>>0)/0xffffffff)*(b-a); };
      colors.forEach((hex) => {
        const [r,g,b] = hexToRgb(hex);
        for(let i=0;i<3;i++){
          const x=rng(0,W),y=rng(0,H),rad=rng(W*0.12,W*0.35);
          const grad=ctx.createRadialGradient(x,y,0,x,y,rad);
          grad.addColorStop(0,`rgba(${r},${g},${b},${rng(0.1,0.2)})`);
          grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
          ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
        }
      });
    }
  },
  // 17. Dark mesh gradient
  {
    name: '다크 메시',
    desc: '어두운 배경에 색상이 자연스럽게 섞임',
    dark: true,
    render: (ctx, W, H, colors) => {
      ctx.fillStyle='#141b2d'; ctx.fillRect(0,0,W,H);
      const positions = [[0.15,0.2],[0.85,0.3],[0.3,0.8],[0.75,0.75]];
      colors.forEach((hex, i) => {
        const [r,g,b] = hexToRgb(hex);
        const [px,py] = positions[i % 4];
        const grad = ctx.createRadialGradient(px*W,py*H,0,px*W,py*H,W*0.45);
        grad.addColorStop(0,`rgba(${r},${g},${b},0.15)`);
        grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
        ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
      });
    }
  },
  // 18. Dark corner accents
  {
    name: '다크 코너 악센트',
    desc: '어두운 배경, 네 모서리에 색상이 은은하게',
    dark: true,
    render: (ctx, W, H, colors) => {
      ctx.fillStyle='#1e1e2e'; ctx.fillRect(0,0,W,H);
      const corners = [[0,0],[W,0],[0,H],[W,H]];
      colors.forEach((hex, i) => {
        const [r,g,b] = hexToRgb(hex);
        const [cx,cy] = corners[i % 4];
        const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,W*0.5);
        grad.addColorStop(0,`rgba(${r},${g},${b},0.15)`);
        grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
        ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
      });
    }
  },
  // 19. Dark clean solid
  {
    name: '다크 클린',
    desc: '배경에 색상 없음, 깔끔한 다크 단색',
    dark: true,
    render: (ctx, W, H) => {
      ctx.fillStyle='#1a1a2e'; ctx.fillRect(0,0,W,H);
    }
  },
  // 20. Dark oil paint
  {
    name: '다크 오일 페인팅',
    desc: '어두운 배경 위에 유화 붓터치 스타일',
    dark: true,
    render: (ctx, W, H, colors) => {
      ctx.fillStyle='#1a1a2e'; ctx.fillRect(0,0,W,H);
      let seed = makeSeed(colors);
      const rng = (a=0,b=1) => { seed=(Math.imul(seed,1664525)+1013904223)|0; return a+((seed>>>0)/0xffffffff)*(b-a); };
      colors.forEach((hex,ci) => {
        const [r,g,b] = hexToRgb(hex);
        const baseAngle = (ci/colors.length)*Math.PI*0.75 - Math.PI*0.25;
        for(let s=0;s<4;s++){
          const sx=rng(0,W),sy=rng(0,H),len=rng(W*0.4,W*0.9);
          const a=baseAngle+rng(-0.3,0.3),ex=sx+len*Math.cos(a),ey=sy+len*Math.sin(a);
          const bow=rng(-H*0.12,H*0.12);
          ctx.beginPath(); ctx.moveTo(sx,sy);
          ctx.bezierCurveTo(sx+len*0.3*Math.cos(a)+bow*Math.sin(a),sy+len*0.3*Math.sin(a)-bow*Math.cos(a),sx+len*0.7*Math.cos(a),sy+len*0.7*Math.sin(a),ex,ey);
          ctx.lineWidth=rng(W*0.05,W*0.14); ctx.lineCap='round';
          ctx.strokeStyle=`rgba(${r},${g},${b},${rng(0.15,0.3)})`; ctx.stroke();
        }
      });
    }
  },
];

const grid = document.getElementById('grid');

BG.forEach((bg, idx) => {
  const card = document.createElement('div');
  card.className = 'card';

  const preview = document.createElement('div');
  preview.className = 'preview';

  const canvas = document.createElement('canvas');
  canvas.width = 640; canvas.height = 560;
  canvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%';
  preview.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  bg.render(ctx, 640, 560, COLORS);

  // Mock UI overlay
  const mock = document.createElement('div');
  mock.className = 'mock-ui';
  const isDark = bg.dark;
  mock.innerHTML = `
    <div class="mock-header ${isDark?'dark':''}">
      <div class="title">CodiPalette</div>
    </div>
    <div class="mock-card ${isDark?'dark':''}">
      <div class="mock-colors">
        ${COLORS.map(c => `<div style="background:${c}"></div>`).join('')}
      </div>
      <div class="mock-labels"><span>외투</span><span>상의</span><span>하의</span><span>신발</span></div>
      <div class="mock-text"></div>
      <div class="mock-text short"></div>
    </div>
  `;
  preview.appendChild(mock);

  const info = document.createElement('div');
  info.className = 'info';
  info.innerHTML = `
    <div class="num">#${idx + 1}</div>
    <div class="name">${bg.name}</div>
    <div class="desc">${bg.desc}</div>
  `;

  card.appendChild(preview);
  card.appendChild(info);
  grid.appendChild(card);
});
</script>
</body>
</html>
